[theme]
base = "dark"
primaryColor = "#B5D99A"
backgroundColor = "#101712"
secondaryBackgroundColor = "#17231B"
textColor = "#F5F1E8"
borderColor = "#2A3A2E"
linkColor = "#B5D99A"
font = "sans-serif"
headingFont = "Georgia, 'Iowan Old Style', 'Palatino Linotype', serif"
codeFont = "monospace"
baseRadius = "14px"
buttonRadius = "full"
showSidebarBorder = false
paddingTop = "1rem"

[theme.sidebar]
backgroundColor = "#141C16"
secondaryBackgroundColor = "#1D2820"
textColor = "#F5F1E8"
borderColor = "#2A3A2E"
primaryColor = "#B5D99A"
linkColor = "#B5D99A"
codeBackgroundColor = "#1D2820"
codeTextColor = "#F5F1E8"
paddingTop = "0.75rem"

[server]
enableStaticServing = true